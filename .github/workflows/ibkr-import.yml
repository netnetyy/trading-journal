name: IBKR Trade Import

on:
  schedule:
    # 05:00 UTC = 08:00 Israel time (day after US market close)
    # Runs Tuesday–Saturday to capture previous weekday's trades
    - cron: '0 5 * * 2-6'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  import-trades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import IBKR trades into journal
        env:
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/ibkr-import.mjs

  # This repo is public, so GitHub disables a scheduled workflow after 60 days
  # without a commit. That silently froze prices on 2026-10-19. Re-enabling the
  # workflow through the API resets that timer, so every run keeps itself alive
  # without dummy commits. A separate job, so it still runs if the import fails.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset the 60-day inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ibkr-import.yml/enable"

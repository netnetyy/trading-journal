name: Scheduled Price Update

on:
  schedule:
    # 21:23 UTC, Monday-Friday: after the US close all year (21:00 UTC in
    # winter, 20:00 in summer). Off the round hour, since GitHub delays
    # scheduled runs at :00 by hours.
    - cron: '23 21 * * 1-5'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update investment prices
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/update-prices.mjs

  # This repo is public, so GitHub disables a scheduled workflow after 60 days
  # without a commit. That silently froze prices on 2026-10-19. Re-enabling the
  # workflow through the API resets that timer, so every run keeps itself alive
  # without dummy commits. A separate job, so it still runs if the import fails.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset the 60-day inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scheduled-price-update.yml/enable"
